name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" \
            || "$SDKM" "platforms/android-37.0" "build-tools/37.0.0"

      - name: Setup signing
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          {
            echo "keyAlias=installguard"
            echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> local.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "HyperOSInstallGuard-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" \
            --title "HyperOSInstallGuard ${{ github.ref_name }}" \
            --generate-notes \
            "HyperOSInstallGuard-${{ github.ref_name }}.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
